name: Tests

on:
  push:
  pull_request:

jobs:
  game:
    name: Play every chapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run the test suite
        env:
          VQ_SLOW: '2'
        run: |
          nvim --version | head -1
          ./tests/run.sh

  scripts:
    name: Check shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh tests/run.sh .githooks/pre-commit
      - run: bash -n install.sh
