name: Docker

# Only runs when something that changes the image's setup changes
on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - init.lua
      - nvim-pack-lock.json
      - lua/custom/**
      - scripts/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - init.lua
      - nvim-pack-lock.json
      - lua/custom/**
      - scripts/**
      - .github/workflows/docker.yml

jobs:
  image:
    name: Build and play in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t vimquest .

      - name: Start offline with everything installed
        run: |
          docker run --rm --network none vimquest --headless -c '
            lua local ok = vim.fn.exists(":VimQuest") == 2 and pcall(require, "vimquest")
            if not ok or vim.v.errmsg ~= "" then
              io.stderr:write("Startup failed: " .. vim.v.errmsg .. "\n")
              vim.cmd.cquit(1)
            end' -c 'qa!'

      - name: Run the test suite inside the image
        env:
          VQ_SLOW: '2'
        run: docker run --rm -e VQ_SLOW --entrypoint .config/nvim/tests/run.sh vimquest
